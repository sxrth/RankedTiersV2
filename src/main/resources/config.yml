# RankedTiers configuration

rating:
  starting: 1000
  win-gain: 25
  loss-loss: 20
  minimum: 0

# Rating thresholds. Higher rating = better tier.
# Matches the real MCTiers/MCPVP ladder: two sub-ranks per tier level
# (LT = Low Tier, HT = High Tier), 5 -> 1, worst to best. No "MT" mid-rank.
# Ascending order: LT5 < HT5 < LT4 < HT4 < LT3 < HT3 < LT2 < HT2 < LT1 < HT1
tiers:
  LT5: 0
  HT5: 900
  LT4: 1000
  HT4: 1100
  LT3: 1200
  HT3: 1300
  LT2: 1400
  HT2: 1500
  LT1: 1600
  HT1: 1700

