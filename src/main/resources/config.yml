messages:
  prefix: "&8[&bRankedTiers&8] &r"

# MCPVP-style clickable hotbar items. Players right-click these instead of
# typing commands. Slots are hotbar indices 0-8. Set enabled: false to fall
# back to commands only.
lobby-items:
  enabled: true
  queue:
    slot: 0
    material: COMPASS
    name: "&b&lQueue"
  party:
    slot: 4
    material: NETHER_STAR
    name: "&d&lParty"
  cosmetics:
    slot: 8
    material: LEATHER_CHESTPLATE
    name: "&6&lCosmetics"

# Cosmetic armor trims, MCPVP-style: purely visual, unlocked as the player's
# tier goes up. Pattern/material ids must match vanilla trim names.
# Edit freely - add/remove entries or change the required tier for each one.
cosmetics:
  enabled: true
  patterns:
    sentry: LT5
    dune: HT5
    coast: HT5
    wild: LT4
    ward: LT4
    eye: HT4
    vex: HT4
    tide: LT3
    snout: LT3
    rib: HT3
    spire: HT3
    wayfinder: LT2
    shaper: LT2
    silence: HT2
    raiser: HT2
    host: LT1
    flow: HT1
    bolt: HT1
  materials:
    quartz: LT5
    iron: HT5
    copper: LT4
    gold: HT4
    lapis: LT3
    amethyst: HT3
    emerald: LT2
    diamond: HT2
    redstone: LT1
    netherite: HT1
